name: Build Cyber AI Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Flutter Project Structure
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "Error: pubspec.yaml not found at repository root."
            exit 1
          fi
          if [ ! -f "lib/main.dart" ]; then
            echo "Error: lib/main.dart not found."
            exit 1
          fi
          echo "Flutter project verified at root."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Toolchain
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Auto-format Code
        run: dart format lib test

      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
